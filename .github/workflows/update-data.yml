name: Update data

on:
  schedule:
    - cron: '17 19 * * *' # 毎日 04:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect from Google Places
        run: npm run collect:google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Build shop list
        run: node scripts/build.js
      - name: Collect from X
        run: npm run collect:x
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Rebuild with all sources
        run: node scripts/build.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources public/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(date -u +%Y-%m-%d)"
            git push
          fi
